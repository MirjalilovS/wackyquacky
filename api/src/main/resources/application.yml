spring:
  application:
    name: wackyquacky-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wackyquacky}
    username: ${DB_USER:wackyquacky}
    password: ${DB_PASSWORD:wackyquacky}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
