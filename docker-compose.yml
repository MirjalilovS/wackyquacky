# Local development only — these credentials match the defaults in application.yml.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wackyquacky
      POSTGRES_USER: wackyquacky
      POSTGRES_PASSWORD: wackyquacky
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
